<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>리뷰 원고 자동 작성 시스템</title>
    <style>
        :root { --primary: #03c75a; --bg: #f8f9fa; --text: #333; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: var(--text); }
        .app-card { width: 100%; max-width: 480px; background: #fff; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 1.4rem; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; margin: 0; }
        .header p { font-size: 0.9rem; color: #888; margin-top: 8px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.85rem; font-weight: 700; color: #444; margin-bottom: 8px; margin-left: 4px; }
        input, select { width: 100%; padding: 12px 16px; border: 1px solid #e1e4e8; border-radius: 12px; font-size: 0.95rem; box-sizing: border-box; transition: all 0.2s; background: #fff; }
        input:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(3, 199, 90, 0.1); }
        .btn-generate { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer; margin-top: 15px; transition: transform 0.1s; }
        .btn-generate:active { transform: scale(0.98); }
        #status-area { margin-top: 20px; text-align: center; font-size: 0.9rem; color: #666; min-height: 20px; font-weight: 500; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>Review</h1>
        <p>리뷰자동 생성기</p>
    </div>
    
    <div class="input-group">
        <label>비즈니스 카테고리</label>
        <select id="bizType">
            <option value="병원">🏥 메디컬 (피부과/성형외과)</option>
            <option value="헤어샵">💇 뷰티 (헤어/에스테틱)</option>
            <option value="맛집">🍕 다이닝 (식당/카페)</option>
        </select>
    </div>
    
    <div class="input-group">
        <label>상품 및 메뉴 정보 (쉼표로 구분)</label>
        <input type="text" id="itemNames" placeholder="예: 울세라 시술, 리쥬란 힐러, 고기 세트">
    </div>
    
    <div class="input-group">
        <label>강조 핵심 키워드 (쉼표로 구분)</label>
        <input type="text" id="keywords" placeholder="예: 섬세한 상담, 깔끔한 시설, 인생 맛집">
    </div>
    
    <div class="input-group">
        <label>작성 희망 수량</label>
        <input type="number" id="count" value="10">
    </div>
    
    <button class="btn-generate" onclick="generateReviews()">맞춤 원고 작성 시작</button>
    <div id="status-area">준비됨</div>
</div>

<script>
    async function generateReviews() {
        const bizType = document.getElementById('bizType').value;
        const itemsInput = document.getElementById('itemNames').value;
        const keysInput = document.getElementById('keywords').value;
        const total = parseInt(document.getElementById('count').value) || 10;
        const statusArea = document.getElementById('status-area');

        if(!itemsInput || !keysInput) return alert("필수 정보를 입력해주세요.");

        const itemList = itemsInput.split(',').map(s => s.trim());
        const keyList = keysInput.split(',').map(s => s.trim());
        const API_KEY = "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";
        
        let finalResults = [];

        const startPhrases = {
            "병원": ["피부 고민 때문에 왔어요.", "원장님 상담이 꼼꼼해요.", "시설이 깨끗하네요.", "지인 추천 만족해요.", "친절하셔서 기분 좋네요."],
            "헤어샵": ["머리 스타일 맘에 들어요.", "디자이너분 손이 빠르네요.", "분위기도 좋고 친절해요.", "커트 맛집이네요."],
            "맛집": ["음식 맛이 일품이에요.", "매장이 쾌적해서 좋네요.", "재료가 정말 신선해요.", "분위기 좋고 친절합니다."]
        };

        const emojis = ["👍", "😊", "✨", "😍", "🙌"];

        for (let i = 1; i <= total; i++) {
            statusArea.innerText = `✍️ ${i}번째 원고를 구성하고 있습니다...`;
            
            const selectedItem = itemList[Math.floor(Math.random() * itemList.length)];
            const selectedKey = keyList[Math.floor(Math.random() * keyList.length)];
            const currentStarts = startPhrases[bizType] || startPhrases["맛집"];
            const selectedStart = currentStarts[Math.floor(Math.random() * currentStarts.length)];
            const addEmoji = (i % 2 === 0) ? emojis[Math.floor(Math.random() * emojis.length)] : "";

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Authorization": "Bearer " + API_KEY, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            {role: "system", content: `너는 실사용자 리뷰어다. 업종: ${bizType}.`},
                            {role: "user", content: `시작: '${selectedStart}', 대상: '${selectedItem}', 키워드: '${selectedKey}'. 자연스럽게 한두 문장으로 작성하고 마지막에 '${addEmoji}'를 붙여라.`}
                        ],
                        temperature: 0.7 
                    })
                });

                const data = await response.json();
                
                if(data.choices && data.choices[0].message && data.choices[0].message.content) {
                    let content = data.choices[0].message.content.trim()
                        .replace(/[a-zA-Z]/g, "") 
                        .replace(/[^가-힣0-9\s.,!~?^👍😊✨🔥😍✔️🙌]/g, "");
                    
                    finalResults.push({ id: i, text: content });
                } else {
                    finalResults.push({ id: i, text: "데이터 생성 지연 - 재시도 권장" });
                }

                await new Promise(res => setTimeout(res, 1200)); 

            } catch (e) {
                console.error(e);
                finalResults.push({ id: i, text: "네트워크 불안정으로 인한 작성 실패" });
            }
        }

        if (finalResults.length > 0) {
            const BOM = "\uFEFF";
            let csvHeader = "No,Draft Content\n";
            let csvBody = finalResults.map(r => `${r.id},"${r.text}"`).join("\n");
            
            const blob = new Blob([BOM + csvHeader + csvBody], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `Draft_Report_${bizType}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            statusArea.innerText = `✅ 총 ${finalResults.length}건의 원고 작성이 완료되었습니다.`;
        } else {
            statusArea.innerText = "❌ 작성된 내용이 없습니다. 정보를 다시 확인해주세요.";
        }
    }
</script>

</body>
</html>
