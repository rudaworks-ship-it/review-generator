<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI 실리뷰 마스터 PRO</title>

<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<style>
:root{
    --naver:#03c75a;
    --bg:#f5f7f9;
    --card:#ffffff;
}

body{
    font-family:'Pretendard',sans-serif;
    background:var(--bg);
    margin:0;
    padding:20px;
    color:#333;
}

.main-layout{
    display:flex;
    gap:20px;
    max-width:1300px;
    margin:auto;
}

.sidebar{
    width:320px;
    background:var(--card);
    padding:25px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
    height:85vh;
    overflow-y:auto;
}

.content{
    flex:1;
    background:var(--card);
    padding:35px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

.shop-item{
    padding:15px;
    border:1px solid #eee;
    border-radius:12px;
    margin-bottom:12px;
    transition:0.2s;
}

.shop-item:hover{
    background:#f7fff9;
    border-color:var(--naver);
}

label{
    font-weight:700;
    display:block;
    margin-bottom:8px;
    font-size:14px;
}

input, textarea{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:15px;
    box-sizing:border-box;
}

.tag-container{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:12px;
    background:#fff;
    min-height:52px;
}

.tag{
    background:#f1f3f5;
    padding:6px 12px;
    border-radius:8px;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:6px;
}

.tag-remove{
    cursor:pointer;
    font-weight:bold;
    color:#999;
}

#tagInput{
    border:none;
    outline:none;
    flex:1;
    min-width:150px;
    font-size:14px;
    padding:5px;
}

.btn-row{
    display:flex;
    gap:10px;
    margin-top:25px;
}

button{
    flex:1;
    padding:16px;
    border:none;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
}

.btn-save{
    background:#444;
    color:#fff;
}

.btn-gen{
    background:var(--naver);
    color:#fff;
    flex:2;
}

.status{
    text-align:center;
    margin-top:20px;
    font-weight:700;
    color:var(--naver);
}
</style>
</head>

<body>

<div class="main-layout">

<div class="sidebar">

    <h2>📂 업체 목록</h2>

    <div id="shopList"></div>

</div>

<div class="content">

    <div>
        <label>업체명</label>
        <input id="shopName">
    </div>

    <div style="margin-top:15px;">
        <label>핵심 키워드 (Enter 또는 쉼표)</label>

        <div class="tag-container" id="tagContainer">
            <input id="tagInput" placeholder="예: 카페, 디저트, 데이트">
        </div>
    </div>

    <div style="margin-top:15px;">
        <label>상세 특징</label>
        <textarea id="point" style="height:120px;"></textarea>
    </div>

    <div style="margin-top:15px;">
        <label>개수</label>
        <input id="count" type="number" value="5">
    </div>

    <div class="btn-row">
        <button class="btn-save" onclick="saveShop()">저장</button>
        <button class="btn-gen" onclick="generateReviews()">생성</button>
    </div>

    <div class="status" id="status">대기</div>

</div>
</div>

<script>

let shops = JSON.parse(localStorage.getItem("shops_v5") || "[]");

let currentTags = [];

const tagInput = document.getElementById("tagInput");
const tagContainer = document.getElementById("tagContainer");

/* 태그 추가 */
function addTag(val){

    val = val.trim().replace(",", "");

    if(val && !currentTags.includes(val)){

        currentTags.push(val);

        renderTags();
    }

    tagInput.value = "";
}

/* 엔터 / 쉼표 */
tagInput.addEventListener("keydown", (e)=>{

    if(e.key === "Enter" || e.key === ","){

        e.preventDefault();

        addTag(tagInput.value);
    }
});

/* 붙여넣기 */
tagInput.addEventListener("input", (e)=>{

    if(e.target.value.includes(",")){

        addTag(e.target.value);
    }
});

/* 태그 렌더 */
function renderTags(){

    document.querySelectorAll(".tag").forEach(t=>t.remove());

    currentTags.forEach((t,index)=>{

        const div = document.createElement("div");

        div.className = "tag";

        div.innerHTML = `
            ${t}
            <span class="tag-remove" onclick="removeTag(${index})">✕</span>
        `;

        tagContainer.insertBefore(div, tagInput);
    });
}

/* 태그 삭제 */
function removeTag(index){

    currentTags.splice(index,1);

    renderTags();
}

/* 저장 */
function saveShop(){

    const name = document.getElementById("shopName").value.trim();
    const point = document.getElementById("point").value.trim();

    if(!name){

        return alert("업체명을 입력해주세요.");
    }

    const data = {
        name,
        tags:[...currentTags],
        point
    };

    const existing = shops.findIndex(s=>s.name===name);

    if(existing > -1){

        shops[existing] = data;

    } else {

        shops.push(data);
    }

    localStorage.setItem("shops_v5", JSON.stringify(shops));

    renderList();

    alert("저장 완료");
}

/* 업체 삭제 */
function deleteShop(event,index){

    event.stopPropagation();

    if(!confirm("삭제하시겠습니까?")) return;

    shops.splice(index,1);

    localStorage.setItem("shops_v5", JSON.stringify(shops));

    renderList();
}

/* 리스트 */
function renderList(){

    const box = document.getElementById("shopList");

    box.innerHTML = "";

    shops.forEach((s,i)=>{

        const div = document.createElement("div");

        div.className = "shop-item";

        div.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">

                <strong 
                    style="flex:1;cursor:pointer;"
                    onclick="loadShop(${i})"
                >
                    ${s.name}
                </strong>

                <button
                    onclick="deleteShop(event, ${i})"
                    style="
                        background:#ffefef;
                        color:#ff4d4f;
                        border:none;
                        border-radius:8px;
                        padding:6px 10px;
                        cursor:pointer;
                        font-size:12px;
                    "
                >
                    삭제
                </button>

            </div>
        `;

        box.appendChild(div);
    });
}

/* 불러오기 */
function loadShop(i){

    const s = shops[i];

    document.getElementById("shopName").value = s.name;

    document.getElementById("point").value = s.point;

    currentTags = s.tags || [];

    renderTags();
}

/* 리뷰 후처리 */
function cleanReview(text){

    text = text.replace(
        /[^\uAC00-\uD7A3\u3131-\u318E0-9\s~!?.😊🙂👍✨ㅎㅎㅋㅠ]/g,
        ""
    );

    text = text.replace(/\s+/g, " ").trim();

    text = text.replace(/너무 너무/g, "너무");
    text = text.replace(/정말 정말/g, "정말");
    text = text.replace(/좋았어요 좋아요/g, "좋았어요");
    text = text.replace(/맛있었어요 맛있어요/g, "맛있었어요");

    /* 업체명 반복 제거 */
    const shopName = document.getElementById("shopName").value.trim();

    const escapedName = shopName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    const regex = new RegExp(escapedName, "g");

    const count = (text.match(regex) || []).length;

    if(count >= 2){

        let removed = false;

        text = text.replace(regex, (match)=>{

            if(!removed){

                removed = true;

                return match;
            }

            return "";
        });

        text = text.replace(/\s+/g, " ").trim();
    }

    /* 끝나는 멘트 다양화 */
    const endingMent = [
        "",
        "",
        "",
        " 다음에도 또 가볼 것 같아요",
        " 생각보다 괜찮아서 만족했어요",
        " 친구들한테도 추천하고 싶네요",
        " 분위기도 좋아서 기억에 남아요",
        " 오랜만에 만족스러운 식사였어요",
        " 전체적으로 편하게 이용했어요",
        " 다음엔 가족이랑 다시 와보려고요",
        " 재방문 의사 있습니다",
        " 기대 이상이라 좋았어요",
        " 기분 좋게 식사하고 왔어요",
        " 음식도 깔끔하게 잘 나오더라고요",
        " 개인적으로 꽤 만족했던 곳이에요",
        " 바다 보면서 먹으니 더 좋았어요",
        " 여행 와서 들르기 괜찮은 곳 같아요"
    ];

    const endings = [
        "",
        "",
        "~",
        "~!",
        "ㅎㅎ",
        "😊",
        "🙂"
    ];

    text = text.replace(/[.!~😊🙂👍✨ㅎㅎ]+$/,"");

    const randomMent = endingMent[
        Math.floor(Math.random() * endingMent.length)
    ];

    const randomEnding = endings[
        Math.floor(Math.random() * endings.length)
    ];

    text += randomMent;

    if(randomEnding){

        if(
            randomEnding.includes("😊") ||
            randomEnding.includes("🙂")
        ){

            text += " " + randomEnding;

        } else {

            text += randomEnding;
        }
    }

    return text;
}

/* 리뷰 생성 */
async function generateReviews(){

    const API_KEY = "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";

    const shopName = document.getElementById("shopName").value;

    const point = document.getElementById("point").value;

    const count = parseInt(document.getElementById("count").value);

    const status = document.getElementById("status");

    if(!shopName){

        return alert("업체명을 입력해주세요.");
    }

    let rows = [["No","리뷰","글자수"]];

    for(let i=1; i<=count; i++){

        status.innerText = `생성 중 ${i}/${count}`;

        try{

            const randomLen = Math.floor(
                Math.random() * (150 - 70 + 1)
            ) + 70;

            const shuffled = [...currentTags].sort(
                ()=>0.5 - Math.random()
            );

            const selectedTags = shuffled.slice(
                0,
                Math.random() > 0.5 ? 2 : 1
            );

            const res = await fetch(
                "https://api.groq.com/openai/v1/chat/completions",
            {

                method:"POST",

                headers:{
                    "Authorization":"Bearer " + API_KEY,
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    model:"llama-3.3-70b-versatile",

                    messages:[

                        {
                            role:"system",

                            content:`
너는 실제 네이버 플레이스 방문자다.

매우 중요:

- 업체명을 매 리뷰마다 반복하지 말 것
- 업체명 언급은 자연스럽게 가끔만 사용
- 어떤 리뷰는 업체명 없이 작성
- 실제 사람이 쓰는 후기 느낌 유지

- 광고 느낌 절대 금지
- AI 느낌 절대 금지
- 실제 사람이 쓴 후기처럼 작성
- 너무 완벽한 문장 금지
- 자연스러운 존댓말 사용
- 키워드는 1~2개만 자연스럽게 사용
- 억지 칭찬 금지
- 외국어 금지
- 영어 금지
- 오타 금지
- 70~150자 사이로 작성

- 매 리뷰마다 첫 문장 구조를 완전히 다르게 작성

- 아래 같은 시작 패턴 반복 금지:
"처음 가봤는데"
"재방문했어요"
"후기 보고 방문했어요"
"궁금해서 가봤는데"
"근처 갔다가 들렀는데"

- 실제 사람이 쓴 것처럼 다양하게 시작
- 끝나는 말투도 매번 다르게 작성
- 마지막 문장도 자연스럽게 다양화

- 매번 다른 사람이 쓴 느낌으로 작성
`
                        },

                        {
                            role:"user",

                            content:`
업체명:
${shopName}

이번 리뷰에서 사용할 키워드:
${selectedTags.join(",")}

상세 특징:
${point}

실제 방문자가 쓴 것처럼 자연스럽게 작성해주세요.
`
                        }

                    ],

                    temperature:0.95
                })
            });

            const data = await res.json();

            let text = data.choices[0].message.content.trim();

            text = cleanReview(text);

            if(text.length < 70){

                text += " 다음에도 들러볼 생각이에요";
            }

            if(text.length > 150){

                text = text.substring(0,150);
            }

            rows.push([i, text, text.length]);

        } catch(e){

            rows.push([i, "에러 발생", 0]);
        }

        await new Promise(r=>setTimeout(r,500));
    }

    const ws = XLSX.utils.aoa_to_sheet(rows);

    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, ws, "Reviews");

    XLSX.writeFile(wb, `${shopName}_리뷰.xlsx`);

    status.innerText = "완료!";
}

renderList();

</script>

</body>
</html>
